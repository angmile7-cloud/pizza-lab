<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dodo's Pizza Lab - Presentación</title>
<script>
/* Phones: the 3D-warped scene makes some mobile browsers drop the game's text while scrolling.
   On phones go straight to the game (it is already full screen there). Add ?escena=1 to force the scene. */
(function () {
  try {
    var touch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || (navigator.maxTouchPoints || 0) > 0;
    var small = Math.min(screen.width, screen.height) < 700;
    var forced = location.search.indexOf('escena') !== -1;
    if (touch && small && !forced) { location.replace('/'); return; }
    if (touch) document.documentElement.className += ' lite';   /* forced scene on a touch device: no heavy effects */
  } catch (e) {}
})();
</script>
<style>
  html, body { margin: 0; height: 100%; background: #120a05; overflow: hidden; overscroll-behavior: none; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; left: 50%; top: 50%; overflow: hidden; background: #120a05; transform: translate(-50%, -50%); }
  #scene { position: absolute; left: 0; top: 0; width: 1672px; height: 941px; transform-origin: 0 0; }
  /* The game lives BEHIND the photo; the photo has a transparent hole where the phone screen is. */
  #screen { position: absolute; left: 0; top: 0; width: 386px; height: 800px; transform-origin: 0 0;
            transform: matrix3d(0.968612332,-0.00478592581,0,7.99090431e-06,-0.042143838,0.928898748,0,-7.05849848e-05,0,0,1,0,669.355957,60.4655151,0,1); background: #000; overflow: hidden; }
  #screen iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  #photo { position: absolute; left: 0; top: 0; width: 1672px; height: 941px; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  #hint { position: fixed; left: 16px; bottom: 16px; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.55);
          color: #fff7e3; font-size: 14px; opacity: 1; transition: opacity .6s ease; pointer-events: none; }
  #hint.is-hidden { opacity: 0; }
  @media (max-width: 700px) { #hint { display: none; } }
  /* ---- ambient effects (above the photo, never over the phone or hands) ---- */
  #fx { position: absolute; left: 0; top: 0; width: 1672px; height: 941px; pointer-events: none; overflow: hidden; }
  .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: flick 2.6s ease-in-out infinite alternate; }
  #glowOven { left: 1330px; top: 215px; width: 350px; height: 210px; background: radial-gradient(ellipse at 50% 60%, rgba(255,150,50,.55), rgba(255,110,20,.18) 55%, transparent 72%); }
  #glowWall { left: 1130px; top: 40px; width: 540px; height: 520px; background: radial-gradient(ellipse at 60% 55%, rgba(255,140,40,.20), transparent 66%); animation-duration: 3.4s; animation-delay: -1s; }
  @keyframes flick { 0% { opacity: .55; transform: scale(.98); } 35% { opacity: 1; } 60% { opacity: .7; transform: scale(1.02); } 100% { opacity: .95; } }
  .puff { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0) 68%);
          filter: blur(5px); opacity: 0; animation: rise var(--d,4s) ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 18% { opacity: var(--o,.22); }
                    100% { opacity: 0; transform: translate(var(--dx,0px), -190px) scale(2.1); } }
  .dust { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,248,230,.75); filter: blur(.6px);
          opacity: 0; animation: drift var(--d,14s) linear infinite; animation-delay: var(--dl,0s); }
  @keyframes drift { 0% { opacity: 0; transform: translate(0,0); } 15% { opacity: .5; } 85% { opacity: .35; }
                     100% { opacity: 0; transform: translate(var(--dx,40px), var(--dy,60px)); } }
  .flash { position: absolute; left: 1250px; top: 120px; width: 420px; height: 330px; border-radius: 50%; mix-blend-mode: screen; opacity: 0;
           background: radial-gradient(ellipse, rgba(255,200,100,.7), transparent 68%); }
  .flash.go { animation: flashgo .9s ease-out; }
  @keyframes flashgo { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
  .lite #fx { display: none; }
  #snd { position: fixed; right: 16px; bottom: 16px; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.55); color: #fff7e3;
         font-size: 14px; border: 0; cursor: pointer; opacity: .75; }
  #snd:hover { opacity: 1; }
  @media (pointer: coarse) { #snd { transition: opacity .5s ease; right: auto; left: 50%; bottom: auto; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); font-size: 15px; padding: 10px 16px; opacity: .92; z-index: 5; } }
  @media (prefers-reduced-motion: reduce) { .glow, .dust { animation: none; } .dust { display: none; } }

</style>
</head>
<body>
<div id="stage">
  <div id="scene">
    <div id="screen"><iframe id="game" src="/" title="Dodo's Pizza Lab, juego" loading="eager" allow="fullscreen"></iframe></div>
    <img id="photo" src="escena.webp" alt="" draggable="false">
    <div id="fx" aria-hidden="true"><div class="glow" id="glowWall"></div><div class="glow" id="glowOven"></div><div class="flash" id="flash"></div></div>
  </div>
</div>
<div id="hint" role="note">F pantalla completa &middot; R reiniciar juego &middot; M sonido</div>
<button id="snd" type="button" aria-label="Sonido">&#128263; Sonido: toca para activar</button>
<script>
(function () {
  var SCENE_W = 1672, SCENE_H = 941;
  var PHONE = { cx: 867, cy: 458, w: 440, h: 832 };   /* phone bezel in scene pixels */
  var stage = document.getElementById('stage');
  var scene = document.getElementById('scene');
  var hint = document.getElementById('hint');
  var params = new URLSearchParams(location.search);
  var ratio = params.get('formato') === '4x5' ? 4 / 5 : null;

  function layout() {
    var vv = window.visualViewport, vw = Math.round(vv ? vv.width : window.innerWidth), vh = Math.round(vv ? vv.height : window.innerHeight);
    var sw = vw, sh = vh;
    if (ratio) { sw = Math.min(vw, vh * ratio); sh = sw / ratio; }
    stage.style.width = sw + 'px'; stage.style.height = sh + 'px';
    var cover = Math.max(sw / SCENE_W, sh / SCENE_H);
    var byH = (sh * 0.97) / PHONE.h, byW = (sw * 0.97) / PHONE.w;
    var s = Math.max(cover, Math.min(byH, byW));
    var tx = sw / 2 - PHONE.cx * s, ty = sh / 2 - PHONE.cy * s;
    tx = Math.min(0, Math.max(sw - SCENE_W * s, tx));
    ty = Math.min(0, Math.max(sh - SCENE_H * s, ty));
    scene.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
  }
  layout();
  window.addEventListener('resize', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 250); });

  var timer;
  function showHint() { hint.classList.remove('is-hidden'); clearTimeout(timer); timer = setTimeout(function () { hint.classList.add('is-hidden'); }, 6000); }
  showHint();
  window.addEventListener('mousemove', showHint);

  /* F = fullscreen, R = restart the game. Works with focus on this page AND inside the game (same origin). */
  var game = document.getElementById('game');
  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t && (t.isContentEditable || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/.test(t.type)))) return;  /* never while typing (e.g. the nickname) */
    var k = (e.key || '').toLowerCase();
    if (k === 'f') {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if (k === 'r') {
      game.src = game.src;
    } else if (k === 'm') {
      if (window.__toggleMute) window.__toggleMute();
    }
  }
  window.addEventListener('keydown', onKey);
  function bindGame() {
    try {
      game.contentWindow.addEventListener('keydown', onKey);
      game.contentWindow.addEventListener('mousemove', showHint);
    } catch (err) { /* cross-origin: shortcuts only work with focus on this page */ }
  }
  game.addEventListener('load', bindGame);
  bindGame();

  /* ================= AMBIENT FX: visuals + synthesized sound, driven by what happens inside the game ================= */
  var fx = document.getElementById('fx'), flash = document.getElementById('flash'), sndBtn = document.getElementById('snd');
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function puff(o, big) {
    var d = document.createElement('div'); d.className = 'puff';
    var s = big ? rnd(70, 120) : rnd(50, 90);
    d.style.cssText = 'left:' + rnd(1390, 1600) + 'px;top:' + rnd(225, 285) + 'px;width:' + s + 'px;height:' + s + 'px;--o:' + o + ';--d:' + rnd(3.4, 5) + 's;--dx:' + rnd(-50, 40) + 'px';
    fx.appendChild(d); setTimeout(function () { d.remove(); }, 5200);
  }
  function burst() { if (reduced) return; for (var i = 0; i < 5; i++) setTimeout(function () { puff(.42, true); }, i * 110); }
  function flashOven() { flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }
  if (!reduced) {
    setInterval(function () { puff(.16, false); }, 1100);
    for (var i = 0; i < 16; i++) {
      var p = document.createElement('div'); p.className = 'dust';
      p.style.cssText = 'left:' + rnd(180, 620) + 'px;top:' + rnd(90, 420) + 'px;--d:' + rnd(11, 20) + 's;--dl:-' + rnd(0, 18) + 's;--dx:' + rnd(-30, 60) + 'px;--dy:' + rnd(20, 90) + 'px';
      fx.appendChild(p);
    }
  }

  /* ---- sound (Web Audio, no files). Starts after the first click; M or the button mutes everything. ---- */
  var ac = null, master = null, muted = false, ambientOn = false;
  function gameWin() { try { return game.contentWindow; } catch (e) { return null; } }
  function ensureAudio(w) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   /* iOS: sound even with the silent switch on */
    if (!ac) {
      var W = w || window;
      var AC = W.AudioContext || W.webkitAudioContext || window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
    }
    if (ac.state !== 'running') { try { ac.resume(); } catch (e) {} }
    try { var b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch (e) {}   /* iOS unlock */
    if (!ambientOn) { ambientOn = true; startAmbient(); if (touch && !soundAsked) { soundAsked = true; label(); setTimeout(function () { sndBtn.style.opacity = '0'; sndBtn.style.pointerEvents = 'none'; }, 1600); } }
    return true;
  }
  var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  function label() { sndBtn.innerHTML = muted ? '&#128263; Sonido apagado' + (touch ? '' : ' (M)') : '&#128266; Sonido activo' + (touch ? '' : ' (M)'); }
  function setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 1; label(); }
  function tone(freq, t0, dur, type, vol, slideTo) {
    var o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  var SFX = {
    pop:   function (t) { tone(520, t, .11, 'sine', .22, 900); tone(1040, t, .06, 'triangle', .06); },
    tick:  function (t) { tone(700, t, .05, 'triangle', .07); },
    bell:  function (t) { tone(1318, t, 1.1, 'sine', .22); tone(1976, t, .9, 'sine', .1); tone(2637, t + .01, .6, 'sine', .05); },
    oops:  function (t) { tone(220, t, .28, 'sawtooth', .09, 130); tone(165, t + .12, .3, 'sawtooth', .08, 95); },
    win:   function (t) { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, t + i * .11, .45, 'triangle', .16); }); },
    lose:  function (t) { tone(392, t, .3, 'triangle', .13, 330); tone(311, t + .22, .5, 'triangle', .13, 220); }
  };
  function play(name) { if (!ensureAudio() || muted) return; SFX[name](ac.currentTime + .01); }

  function noiseBuf(sec) { var n = ac.sampleRate * sec, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; return b; }
  function startAmbient() { /* no background noise: only the short game sounds */ }
  var soundAsked = false;
  sndBtn.addEventListener('click', function () {
    ensureAudio(window);
    if (!soundAsked) { soundAsked = true; setMuted(false); } else setMuted(!muted);
    /* on touch screens the button covers the game's header: hide it a moment after sound is on */
    if (touch && !muted) setTimeout(function () { sndBtn.style.opacity = '0'; sndBtn.style.pointerEvents = 'none'; }, 1600);
  });
  label(); sndBtn.innerHTML = touch ? '&#128266; Toca aqu&iacute; para activar el sonido' : '&#128266; Toca el juego para activar el sonido';

  /* ---- listen to the game (same origin; if this ever fails the scene just stays quiet) ---- */
  var seen = new WeakSet();
  function react(el) {
    var c = el.className && el.className.baseVal === undefined ? String(el.className) : '';
    if (/order-result--success/.test(c)) { play('bell'); burst(); flashOven(); }
    else if (/order-result--/.test(c)) { play('oops'); }
    if (/level-result-layout--passed/.test(c)) { play('win'); burst(); flashOven(); }
    else if (/level-result-layout--failed/.test(c)) { play('lose'); }
  }
  function scan(root) {
    if (!root || root.nodeType !== 1) return;
    var list = [root].concat([].slice.call(root.querySelectorAll('[class*="order-result--"],[class*="level-result-layout--"]')));
    list.forEach(function (el) { if (!seen.has(el) && /order-result--|level-result-layout--/.test(String(el.className))) { seen.add(el); react(el); } });
  }
  function bindFx() {
    try {
      var w = game.contentWindow, d = w.document; if (!d || !d.body) return;
      if (d.__fxBound) return; d.__fxBound = true;
      d.addEventListener('change', function (e) {
        var t = e.target; if (t && t.tagName === 'INPUT' && (t.type === 'checkbox' || t.type === 'radio')) { play('pop'); if (t.checked) burst(); }
      }, true);
      d.addEventListener('touchend', function () { ensureAudio(w); }, true);
      d.addEventListener('click', function (e) {
        ensureAudio(w);
        var b = e.target.closest && e.target.closest('button'); if (!b) return;
        if (/ENTREGAR/i.test(b.textContent || '')) return;      /* the result sound handles it */
        play('tick');
      }, true);
      new w.MutationObserver(function (list) { list.forEach(function (m) { m.addedNodes.forEach(scan); if (m.type === 'attributes') scan(m.target); }); })
        .observe(d.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
      scan(d.body);
    } catch (err) { /* cross-origin: no sync */ }
  }
  game.addEventListener('load', function () { setTimeout(bindFx, 50); });
  setTimeout(bindFx, 300);
  window.addEventListener('pointerdown', function () { ensureAudio(window); });
  window.__toggleMute = function () { ensureAudio(gameWin()); setMuted(!muted); };
})();
</script>
</body>
</html>
